name: GrowthPilot daily
on:
  schedule:
    - cron: '0 6 * * *'
      timezone: Europe/Paris
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/growthpilot.yml', 'scripts/growthpilot-runner.py']
permissions:
  contents: read
  id-token: write
concurrency:
  group: growthpilot-okko
  cancel-in-progress: false
jobs:
  daily:
    if: github.repository == 'Rhegaaa/okko-digital' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Research, write, check, publish and verify
        env:
          PYTHONUNBUFFERED: '1'
        run: python3 scripts/growthpilot-runner.py
  backup:
    needs: daily
    if: success() && github.repository == 'Rhegaaa/okko-digital' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Select weekly backup
        id: select
        run: |
          if [ "$(TZ=Europe/Paris date +%u)" = "1" ] || [ "$GITHUB_EVENT_NAME" = "push" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        if: steps.select.outputs.enabled == 'true'
        with:
          ref: main
      - name: Save encrypted editorial backup
        if: steps.select.outputs.enabled == 'true'
        run: |
          python3 scripts/growthpilot-runner.py --backup
          if [ -f growthpilot/backups/latest.enc.json ]; then
            git add -- growthpilot/backups/latest.enc.json
            if ! git diff --cached --quiet; then
              git -c user.name='GrowthPilot backup' -c user.email='growthpilot@users.noreply.github.com' commit -m 'Sauvegarde chiffrée GrowthPilot'
              git push origin HEAD:main
            fi
          fi
